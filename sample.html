<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .overall{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }

        .box{
            overflow: hidden;
            position: relative;
            height: 300px;
            width:250px;
            background-color: transparent;
        }

        .circle{
            top:-90%;
            left:65%;
            border-radius: 50%;
            position: absolute;
            height: 400px;
            width:400px;
            transition-duration: 1s;
            background-color: rgba(255, 255, 255, 0.5);
        }

        .box:hover .circle{
            border-radius:0%;
            top:0;
            left:0;
        }



    </style>
</head>

<body>
    <div class="overall">
        <div class="box">
            <div class="circle"></div>
        </div>
    </div>
</body>

</html>
